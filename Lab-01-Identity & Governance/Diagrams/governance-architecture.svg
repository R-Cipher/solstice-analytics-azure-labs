<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lab 01 governance layout: Entra ID groups, a custom role, two deny policies and a delete lock on rg-solstice-core</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="420" rx="12" fill="#FFFFFF"/>

<rect x="40" y="30" width="220" height="230" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="60" y="54" font-size="14" font-weight="600" fill="#2C2C2A" dominant-baseline="central">Entra ID tenant</text>
<text x="60" y="72" font-size="12" fill="#5F5E5A" dominant-baseline="central">Security groups</text>
<rect x="60" y="95" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75"/>
<text x="150" y="113" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">sg-client-success</text>
<text x="150" y="133" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Standard members</text>
<rect x="60" y="175" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75"/>
<text x="150" y="193" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">sg-contractors-external</text>
<text x="150" y="213" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Guest members</text>

<rect x="40" y="290" width="220" height="56" rx="8" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="150" y="308" font-size="14" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">PIM eligible Owner</text>
<text x="150" y="328" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Not built: needs Entra ID P2</text>

<rect x="300" y="30" width="340" height="340" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="320" y="54" font-size="14" font-weight="600" fill="#2C2C2A" dominant-baseline="central">Subscription: Solstice-Production</text>
<rect x="320" y="72" width="300" height="282" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="334" y="88" font-size="12" fill="#5F5E5A" dominant-baseline="central">rg-solstice-core  (CostCenter = SOL-001)</text>

<rect x="330" y="102" width="280" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="470" y="120" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Custom role: Dashboard Operator</text>
<text x="470" y="140" font-size="11.5" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Web Apps + Storage; no network/Key Vault delete</text>

<rect x="330" y="166" width="280" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="470" y="184" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Policy: Require CostCenter tag</text>
<text x="470" y="204" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Effect: deny</text>

<rect x="330" y="230" width="280" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="470" y="248" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Policy: Allowed locations</text>
<text x="470" y="268" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">East US, East US 2 only. Effect: deny</text>

<rect x="330" y="294" width="280" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="470" y="312" font-size="14" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Resource lock: CanNotDelete</text>
<text x="470" y="331" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Created last, removed first on destroy</text>

<line x1="240" y1="123" x2="328" y2="129" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<text x="40" y="396" font-size="12" fill="#5F5E5A" dominant-baseline="central">Arrow: the role is assigned to the group, never to individual users.</text>
</svg>
