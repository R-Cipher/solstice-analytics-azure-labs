<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Private endpoint, Private Link and private DNS zone layout for Lab 02</title>
